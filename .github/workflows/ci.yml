name: Integración continua

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Iniciar PostgreSQL
        run: docker compose up -d --wait

      - name: Probar el esquema SQL
        run: |
          docker cp database/tests/schema_tests.sql xanpan-postgres:/tmp/schema_tests.sql
          docker compose exec -T postgres psql \
            -v ON_ERROR_STOP=1 \
            -U xanpan \
            -d xanpan \
            -f /tmp/schema_tests.sql

      - name: Mostrar registros de PostgreSQL si falla
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Detener PostgreSQL
        if: always()
        run: docker compose down --volumes
