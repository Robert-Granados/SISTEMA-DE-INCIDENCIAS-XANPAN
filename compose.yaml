services:
  postgres:
    image: postgres:17-alpine
    container_name: xanpan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xanpan}
      POSTGRES_USER: ${POSTGRES_USER:-xanpan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xanpan_dev}
      TZ: ${TZ:-America/Costa_Rica}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
